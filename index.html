<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Attendance System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="header">
<img src="./logo.jpeg.jpeg" class="logo" alt="Logo">




    <h1>School Attendance System</h1>

    
<img src="school.jpeg.jpeg" class="school-pic" alt="School">
</div>


<h2>🏫 School Information</h2>

<input type="text" id="schoolName" placeholder="School Name">

<input type="text" id="headMaster" placeholder="Head Master Name">

<input type="text" id="teacherName" placeholder="Class Teacher Name">

<select id="studentClass">
    <option value="">Select Class</option>
    <option value="Class 1">Class 1</option>
    <option value="Class 2">Class 2</option>
    <option value="Class 3">Class 3</option>
    <option value="Class 4">Class 4</option>
    <option value="Class 5">Class 5</option>
    <option value="Class 6">Class 6</option>
    <option value="Class 7">Class 7</option>
    <option value="Class 8">Class 8</option>
    <option value="Class 9">Class 9</option>
    <option value="Class 10">Class 10</option>
</select>




<div class="card">
  <h2>👨‍🎓 Student Information</h2>

<input type="number" id="serialNumber" placeholder="Serial Number">

<input type="text" id="studentName" placeholder="Student Name">

<input type="text" id="fatherName" placeholder="Father's Name">



<input type="number" id="rollNumber" placeholder="Roll Number">
<input type="text" id="search" placeholder="Search Student">
<label>🎂 Date of Birth</label>
<input type="date" id="dob">

<label>📅 Date of Admission</label>
<input type="date" id="admissionDate">
<h2>📅 Attendance Information</h2>

<label>Date</label>
<input type="date" id="attendanceDate">

<label>Time</label>
<input type="time" id="attendanceTime">

<label>Day</label>
<select id="attendanceDay">
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>
    <option style="color:red;">Sunday (Holiday)</option>
</select>










<div class="buttons">
<button onclick="markAttendance('Present')">✅ Present</button>
<button onclick="markAttendance('Absent')">❌ Absent</button>
<button onclick="downloadPDF()">📄 Download PDF</button>
</div>


<table>

<thead>
<tr>
<th>Sr</th>
<th>Roll</th>
<th>Name</th>
<th>Father</th>
<th>School</th>
<th>Head Master</th>
<th>Teacher</th>
<th>Class</th>
<th>DOB</th>
<th>Admission</th>

<th>Date</th>
<th>Time</th>
<th>Day</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="attendanceTable"></tbody>

</table>




<div class="footer">
    <h3>Developed by Nadeem Hussain Channa</h3>
    <p>Primary School Teacher</p>
    <p>GBLSS Saeed Khan Khushik</p>
</div>

<script src="app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</body>
    </html>
